name: iOS — bootstrap de credenciais (rodar uma vez)

# Cria certificado de distribuicao e provisioning profile e os guarda cifrados
# no repo de certificados do match.
#
# Existe para que voce nunca precise de um Mac: o `fastlane match` roda aqui, no
# runner macOS, em vez de na sua maquina. Depois de rodar com sucesso uma vez,
# o workflow de build usa match em modo readonly.
#
# Pre-requisitos (secrets do repo):
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (o .p8 em base64),
#   MATCH_GIT_URL (repo PRIVADO e separado, so para certificados),
#   MATCH_PASSWORD (senha que cifra o repo de certificados),
#   MATCH_GIT_BASIC_AUTHORIZATION (base64 de "usuario:token" com acesso a esse repo)
on:
  workflow_dispatch:

concurrency:
  group: ios-credentials
  cancel-in-progress: false

jobs:
  certificates:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      FASTLANE_DISABLE_COLORS: '1'
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile

      - name: Criar certificados via match
        run: bundle exec fastlane ios certificates
